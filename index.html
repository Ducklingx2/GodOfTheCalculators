<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="background"></div>

<div class="tabs">

    <button class="tab active" data-tab="basic">
        Basic
    </button>

    <button class="tab" data-tab="scientific">
        Scientific
    </button>

    <button class="tab" data-tab="statistics">
        Statistics
    </button>

    <button class="tab" data-tab="geometry">
        Geometry
    </button>

    <button class="tab" data-tab="finance">
        Finance
    </button>

</div>    

<div class="calculator">

    <h1>Calculator</h1>

    <div class="display">
        <input type="text" 
               placeholder="Enter expression..." 
               id="display" 
               autocomplete="off"
               readonly>
    </div>

    <div class="buttons">

        <button>(</button>
        <button>)</button>
        <button>%</button>
        <button class="operator">÷</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">×</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">−</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">+</button>

        <button>0</button>
        <button>.</button>
        <button>C</button>
        <button class="equals">=</button>

    </div>

</div>

<script src="calc.js"></script>
<script src="basic.js"></script>
<script src="scientific.js"></script>

</body>
</html>
